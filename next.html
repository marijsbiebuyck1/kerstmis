<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Volgend spelletje</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&family=Reenie+Beanie&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
      /* make the title sit at the same vertical position as on the memory page */
      .center-stack.next{
        align-items:flex-start;
        padding-top:0;
        /* increase vertical space so falling letter stays visible */
        height: min(92vh, 1000px);
        display:grid;
        grid-template-rows: auto 1fr auto;
        gap:6px;
        margin-top:-18px; /* match memory tweak */
      }
      .center-stack.next .title{font-family: 'Reenie Beanie', cursive; font-size:clamp(40px,5.6vw,34px);font-weight:400;line-height:1;margin-top:-14px;margin-bottom:4px;text-align:center}
  .center-stack.next .main-content{display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:6px;padding-bottom:12px;overflow:hidden;margin-bottom:0;background:#e2e2e2;min-height:56vh}
      .next-image{
        width:clamp(420px,72vw,900px);
        max-width:100%;
        height:auto;
        /* allow the image to be larger so it remains visible when it lands */
        max-height:64vh; /* keep it contained vertically on small devices */
        object-fit:contain;
        display:block;
        margin:0 auto;
        /* prepare for the falling animation */
        will-change: transform, opacity;
        transform-origin: 50% 0%;
        /* start off slightly above so the fall looks natural */
        transform: translateY(-8vh) rotate(-6deg);
      }
      /* falling keyframes: downward drift with gentle rotation and horizontal sway */
      @keyframes fall {
        0% {
          transform: translateY(-12vh) translateX(0) rotate(-10deg);
          opacity: 0;
        }
        12% {
          opacity: 1;
        }
        60% {
          /* land earlier: reach a higher position on the page */
          transform: translateY(18vh) translateX(2vw) rotate(4deg);
          opacity: 1;
        }
        100% {
          /* remain in the landed position (no disappearing) */
          transform: translateY(18vh) translateX(0) rotate(6deg);
          opacity: 1;
        }
      }
      /* helper class to trigger the animation once and keep final state */
      .next-image.is-falling {
        animation: fall 8000ms cubic-bezier(.2,.9,.2,1) forwards;
      }
      .actions{display:flex;justify-content:center;margin-top:12px}
    </style>
  </head>
  <body class="next">
    <main class="screen">
      <div class="card">
        <div class="center-stack next">
          <h1 class="title">Je hebt post!</h1>

          <div class="main-content">
            <img src="assets/Group 9.svg" alt="illustratie" class="next-image" id="letterImg">
          </div>

          <div class="actions">
            <a class="btn primary" href="index.html">Open de brief</a>
          </div>
        </div>
      </div>
    </main>
    <script>
      // trigger the falling animation once on load; also allow replay by clicking the image
      (function(){
        const img = document.getElementById('letterImg');
        if(!img) return;
        // small timeout so the page paints before animation starts
        window.addEventListener('DOMContentLoaded', ()=>{
          requestAnimationFrame(()=> setTimeout(()=> img.classList.add('is-falling'), 80));
        });
        // allow click to replay the animation
        img.addEventListener('click', ()=>{
          img.classList.remove('is-falling');
          // reflow then re-add
          void img.offsetWidth;
          img.classList.add('is-falling');
        });
      })();
    </script>
  </body>
</html>
